<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Rail Builder Studio — レールレイアウト作成アプリの案内とサポート情報">
  <title>Rail Builder Studio</title>
  <style>
    :root { color: #183143; background: #edf5f6; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 14% 8%, #c7edf0 0, transparent 32%), linear-gradient(150deg, #f9fcfc, #edf3f5); }
    main { width: min(100%, 680px); padding: clamp(32px, 8vw, 64px); border: 1px solid rgba(255,255,255,.9); border-radius: 30px; background: rgba(255,255,255,.86); box-shadow: 0 24px 70px rgba(31,64,78,.13); }
    .mark { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 18px; color: #fff; background: #4ea2b2; font-size: 30px; }
    h1 { margin: 22px 0 8px; font-size: clamp(32px, 8vw, 48px); letter-spacing: -.045em; }
    p { color: #526b7a; line-height: 1.8; }
    .links { display: grid; gap: 12px; margin-top: 30px; }
    a { display: block; padding: 16px 18px; border-radius: 14px; color: #087f9a; background: #e7f5f6; font-weight: 700; text-decoration: none; }
    a:hover { background: #d9f0f2; }
    footer { margin-top: 40px; color: #78909c; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◉</div>
    <h1>Rail Builder Studio</h1>
    <p>Rail Builderは、手持ちのレール在庫から3Dレイアウト案を作成するアプリです。</p>
    <div class="links">
      <a href="https://sibuyama924-png.github.io/rail-builder-legal/">プライバシーポリシー</a>
      <a href="https://sibuyama924-png.github.io/rail-builder-legal/support.html">サポート窓口</a>
    </div>
    <footer>© 2026 Rail Builder</footer>
  </main>
</body>
</html>
